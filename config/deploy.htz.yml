# Name of your application. Used to uniquely configure containers.
service: Dicisports

# Name of the container image.
image: kimile/dicisports

# Deploy to these servers.
servers:
  web:
    - 5.161.176.161
    - 178.156.166.134

# Credentials for your image host.
registry:
  server: ghcr.io
  username: kimile

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  dockerfile: Dockerfile


proxy:
  hosts: 
    - dicisports.com
    - www.dicisports.com
  app_port: 3000

deploy_timeout: 90

# Environment variables (pulled from .kamal/secrets.htz)
env:
  clear:
    AWS_REGION: eu-west-3
    AWS_S3_BUCKET: dicisports-prd
    CLOUDINARY_CLOUD_NAME: dici-sports-prd
    CLOUDINARY_UPLOAD_FOLDER_TARGET: users/
    CLOUDINARY_UPLOAD_PRESET: users
    CONVERT_KIT_FORM: 3571549
    DEFAULT_COMMISSION: 8
    DOMAIN_URL: https://dicisports.com
    IMAGE_DISPLAY_ENDPOINT: https://res.cloudinary.com/dici-sports-prd/image/upload
    IMAGE_UPLOAD_ENDPOINT: https://api.cloudinary.com/v1_1/dici-sports-prd/image/upload
    MAILGUN_DOMAIN: mail.dicisports.com
    MAILGUN_ENDPOINT: https://api.eu.mailgun.net/v3/mail.dicisports.com/messages
    ORGANIZER_REVIEWERS_EMAILS: filipe@dicisports.com
    SIBS_CHECK_STATUS_ENDPOINT: https://api.sibspayments.com/assets/js/widget.js
    SIBS_CHECKOUT_FORM_SCRIPT: https://api.sibspayments.com/api/v2/payments/{{transactionID}}/status
    SIBS_CLIENT_ID: adad3a5c-19ed-4d0a-b54c-8defa92919fc
    SIBS_MULTIBANCO_ENTITIY: 47077
    SIBS_MULTIBANCO_EXPIRATION_DAYS: 3
    SIBS_TERMINAL_ID: 1410501
    SIBS_URL_ENDPOINT: https://api.sibspayments.com/api/v2/payments
    SLACK_ERRORS_WEBHOOK_URL: https://hooks.slack.com/services/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
    SMS_APPLICATION_ID: 32132
    SMS_ENDPOINT: https://portal.bulkgate.com/api/1.0/simple/transactional
    RELEASE: fc1368f0b83e76795fd32cf1a86573822e7de7b5
  secret:
    - KAMAL_REGISTRY_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - CLOUDINARY_API_KEY
    - CLOUDINARY_API_SECRET
    - CONVERT_KIT_API_KEY
    - CREATE_EVENT_TOKEN
    - DATABASE_URL
    - EMAIL_VERIFIER_TOKEN
    - MAGIC_LINK_SECRET
    - MAILGUN_SENDING_KEY
    - MAPBOX_TOKEN
    - SCHEDULER_SECRET
    - SESSION_SECRET
    - SIBS_API_TOKEN
    - SIBS_WEBHOOK_SECRET
    - SMS_APPLICATION_TOKEN
