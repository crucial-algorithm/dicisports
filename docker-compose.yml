version: '3'
services:
  database:
    image: 'postgres:13'
    environment:
      - POSTGRES_USER=dici
      - POSTGRES_PASSWORD=sports
      - POSTGRES_DB=dicisports
    ports:
      - '6432:5432'

  mailgun:
    image: 'fakemailgun:latest'
    build:
      context: services/fakemailgun/.
      dockerfile: .
    ports:
      - '8080:8080'
