name: Docker Compose in GHA
on: pull_request


jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E on Chrome

    steps:
      - name: Checkout dicisports
        uses: actions/checkout@v3


      - name: Start services
        run: |
          docker compose -f docker-compose-ci.yml up -d --build
          
          function wait_for_container {
              container_id="$1"
              container_name="$(docker inspect "${container_id}" --format '{{ .Name }}')"
              echo "Waiting for container: ${container_name} [${container_id}]"
              waiting_done="false"
              while [[ "${waiting_done}" != "true" ]]; do
                  container_state="$(docker inspect "${container_id}" --format '{{ .State.Status }}')"
                  # echo $container_state
                  if [[ "${container_state}" == "running" ]]; then
                      health_status="$(docker inspect "${container_id}" --format '{{ .State.Status }}')"
                      echo "${container_name}: container_state=${container_state}, health_status=${health_status}"
                      if [[ ${health_status} == "healthy" ]]; then
                          waiting_done="true"
                      fi
                  else
                      echo "${container_name}: container_state=${container_state}"
                      waiting_done="true"
                  fi
                  sleep 1;
              done;
          }
          
          
          container_id="$(docker compose -f docker-compose-ci.yml ps dicisports -q)"
          wait_for_container $container_id

      - name: Test connection to http-catcher
        run: |
          curl localhost:3001/health-check

      - uses: actions/upload-artifact@v2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - uses: actions/upload-artifact@v2
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos

