name: Deploy production
on:
  push:
    branches:
      - master

env:
  - FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  name: Deploy app
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v2
    - uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        args: "deploy --app diciprd --remote-only"
