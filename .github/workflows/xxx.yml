name: Learning GitHub actions
on: pull_request

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E on Chrome

    steps:
      - name: Check installed node version
        run: |
          node --version
          npm --version

      - name: Install fnm
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash

      - name: Export fnm to path
        run: |
          export PATH="/home/runner/.local/share/fnm:$PATH"
          eval "`fnm env`"

      - name: Checkout dicisports
        uses: actions/checkout@v3

      - name: Checkout http-catcher
        uses: actions/checkout@v3
        with:
          repository: crucial-algorithm/http-catcher
          path: http-catcher

      - name: Install http-catcher dependencies
        run: |
          cd http-catcher
          /home/runner/.local/share/fnm/fnm install
          npm ci
          npm --version
          export ENDPOINTS='[{"method": "post", "endpoint": "/sibs-mock-checkout", "response": {"formContext": "{\"transactionId\": \"{{merchant.merchantTransactionId}}\"}", "expiry": "2099-12-31", "transactionID": "{{merchant.merchantTransactionId}}" } }, { "method": "post", "endpoint": "/sibs-mock-form-submit", "response": { "type": "redirect", "url": "http://{{requester_ip}}:3050/checkout/submitted/{{transactionId}}" }, "sideEffect": { "delay": 500, "url": "http://{{requester_ip}}:3050/wh/sibs", "method": "post", "headers": [{"key": "X-Authentication-Tag", "value": "{{at}}"}, {"key": "X-Initialization-Vector", "value": "{{iv}}"}, {"key": "Content-Type", "value": "text/plain"}], "body": "{{message}}" } }, {"method": "get", "endpoint": "/sibs-status-mock/{{transactionID}}", "response": {"type": "case", "options": {"test": "transactionID", "responses": [{"value": "reference-pending", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-pending", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Pending", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "0.0", "currency": "EUR"}, "status": "UNPAID", "expireDate": "2023-05-23T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-19T10:44:19.578Z", "startTime": "2023-05-19T10:44:17.943Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-paid", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-paid", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Success", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "46.0", "currency": "EUR"}, "status": "PARTPAIDCLS", "expireDate": "2023-05-23T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T15:30:42.504Z", "startTime": "2023-05-20T15:30:41.503Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-expired", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-expired", "amount": {"currency": "EUR", "value": "40.00"}, "paymentType": "PREF", "paymentStatus": "Declined", "paymentReference": {"status": "UNKN", "expireDate": "2023-05-20T12:22:00.495+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T11:30:50.639Z", "startTime": "2023-05-20T11:30:49.461Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}]}}}]';nohup node index.js & 

      - name: Check node version
        run: | 
          node --version
          npm --version

      - name: Install dicisports dependencies
        run: npm ci

      # not sure why, but we can't write to files without updating permissions
      - name: Reset permissions
        run: chmod -R 777 .
