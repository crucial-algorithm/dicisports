name: Learning GitHub actions
on: pull_request

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E on Chrome

    steps:
      - name: Check installed node version
        run: |
          node --version
          npm --version

      - name: Install fnm
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash

      - name: Export fnm to path
        run: |
          export PATH="/home/runner/.local/share/fnm:$PATH"
          eval "`fnm env`"

      - name: Checkout dicisports
        uses: actions/checkout@v3

      - name: Checkout http-catcher
        uses: actions/checkout@v3
        with:
          repository: crucial-algorithm/http-catcher
          path: http-catcher

      - name: Install http-catcher dependencies
        run: |
          cd http-catcher
          /home/runner/.local/share/fnm/fnm install
          npm ci
          npm --version
          nohup node index.js & 

      - name: Check node version
        run: | 
          node --version
          npm --version

      - name: Install dicisports dependencies
        run: npm ci

      # not sure why, but we can't write to files without updating permissions
      - name: Reset permissions
        run: chmod -R 777 .
