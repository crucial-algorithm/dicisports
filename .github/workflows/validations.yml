name: Code validation
on: push

jobs:
  # Label of the container job
  e2e:
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    # Docker Hub image that `container-job` executes in
    container: cypress/browsers:node16.14.0-chrome99-ff97

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: dici
          POSTGRES_DB: dicisports
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Debug - EACCES
        run: chmod 777 app/styles/

      - name: Generate CSS dependencies
        run:  npm run generate:css

      - name: Deploy CSS
        run: npm run deploy:css

      - name: Start Dicisports Instance
        run: npm run dev &
        env:
          DATABASE_URL: ${{secrets.E2E_DATABASE_URL}}

          MAPBOX_TOKEN: ${{secrets.MAPBOX_TOKEN}}

          CLOUDINARY_CLOUD_NAME: ${{secrets.CLOUDINARY_CLOUD_NAME}}
          CLOUDINARY_API_KEY: ${{secrets.CLOUDINARY_API_KEY}}
          CLOUDINARY_API_SECRET: ${{secrets.CLOUDINARY_API_SECRET}}
          CLOUDINARY_UPLOAD_PRESET: ${{secrets.CLOUDINARY_UPLOAD_PRESET}}

          SESSION_SECRET: ${{secrets.SESSION_SECRET}}
          MAGIC_LINK_SECRET: ${{secrets.MAGIC_LINK_SECRET}}

          EMAIL_VERIFIER_TOKEN: ${{secrets.EMAIL_VERIFIER_TOKEN}}
          MAILGUN_SENDING_KEY: ${{secrets.MAILGUN_SENDING_KEY}}

          CONVERT_KIT_FORM: ${{secrets.CONVERT_KIT_FORM}}
          CONVERT_KIT_API_KEY: ${{secrets.CONVERT_KIT_API_KEY}}

          AWS_S3_BUCKET: ${{secrets.AWS_S3_BUCKET}}
          AWS_REGION: ${{secrets.AWS_REGION}}
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: Cypress e2e tests
        uses: cypress-io/github-action@v4.2.0
        with:
          browser: chrome
