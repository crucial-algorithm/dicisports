name: E2E tests - Events
on: pull_request

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E on Chrome

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: dici
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: dicisports
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      http-catcher:
        image: filipeutter/http-catcher
        env:
          ENDPOINTS: '[{"method": "post", "endpoint": "/sibs-mock-checkout", "response": {"formContext": "{\"transactionId\": \"{{merchant.merchantTransactionId}}\"}", "expiry": "2099-12-31", "transactionID": "{{merchant.merchantTransactionId}}" } }, { "method": "post", "endpoint": "/sibs-mock-form-submit", "response": { "type": "redirect", "url": "http://localhost:3000/checkout/submitted/{{transactionId}}" }, "sideEffect": { "delay": 2000, "url": "http://host.docker.internal:3000/wh/sibs", "method": "post", "headers": [{"key": "X-Authentication-Tag", "value": "{{at}}"}, {"key": "X-Initialization-Vector", "value": "{{iv}}"}, {"key": "Content-Type", "value": "text/plain"}], "body": "{{message}}" } }, {"method": "get", "endpoint": "/sibs-status-mock/{{transactionID}}", "response": {"type": "case", "options": {"test": "transactionID", "responses": [{"value": "reference-pending", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-pending", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Pending", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "0.0", "currency": "EUR"}, "status": "UNPAID", "expireDate": "2023-05-23T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-19T10:44:19.578Z", "startTime": "2023-05-19T10:44:17.943Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-paid", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-paid", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Success", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "46.0", "currency": "EUR"}, "status": "PARTPAIDCLS", "expireDate": "2023-05-23T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T15:30:42.504Z", "startTime": "2023-05-20T15:30:41.503Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-expired", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-expired", "amount": {"currency": "EUR", "value": "40.00"}, "paymentType": "PREF", "paymentStatus": "Declined", "paymentReference": {"status": "UNKN", "expireDate": "2023-05-20T12:22:00.495+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T11:30:50.639Z", "startTime": "2023-05-20T11:30:49.461Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}]}}}]'
        ports:
          - 3001:3001

    steps:
      - name: Test connection
        run: |
          curl localhost:3001

      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      # not sure why, but we can't write to files without updating permissions
      - name: Reset permissions
        run: chmod -R 777 .

      - name: Cypress e2e tests
        uses: cypress-io/github-action@v4.2.0
        with:
          browser: chrome
          record: false
          build: npm run ci:build
          start: npm run dev
          spec: cypress/e2e/app/events.cy.ts
        env:
          CY_REQUEST_TIMEOUT: 15000
          CY_RESPONSE_TIMEOUT: 90000
          CY_DEFAULT_COMMAND_TIMEOUT: 30000

          DATABASE_URL: postgresql://dici:sports@localhost:5432/dicisports?schema=public&charset=utf8

          MAPBOX_TOKEN: ${{secrets.E2E_MAPBOX_TOKEN}}

          CLOUDINARY_CLOUD_NAME: dicisports
          CLOUDINARY_API_KEY: ${{secrets.E2E_CLOUDINARY_API_KEY}}
          CLOUDINARY_API_SECRET: ${{secrets.E2E_CLOUDINARY_API_SECRET}}
          CLOUDINARY_UPLOAD_PRESET: members-upload

          SESSION_SECRET: ${{secrets.E2E_SESSION_SECRET}}
          MAGIC_LINK_SECRET: ${{secrets.E2E_MAGIC_LINK_SECRET}}

          EMAIL_VERIFIER_TOKEN: ${{secrets.E2E_EMAIL_VERIFIER_TOKEN}}
          MAILGUN_SENDING_KEY: ${{secrets.E2E_MAILGUN_SENDING_KEY}}
          MAILGUN_ENDPOINT: http://127.0.0.1:3001

          CONVERT_KIT_FORM: 3280014
          CONVERT_KIT_API_KEY: ${{secrets.E2E_CONVERT_KIT_API_KEY}}

          AWS_S3_BUCKET: dicisports-dev
          AWS_REGION: eu-west-3
          AWS_ACCESS_KEY_ID: ${{secrets.E2E_AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.E2E_AWS_SECRET_ACCESS_KEY}}

          RELEASE: ${{ github.sha }}

          SIBS_CHECKOUT_FORM_SCRIPT: /sibs.mock.js
          SIBS_API_TOKEN: x
          SIBS_URL_ENDPOINT: http://127.0.0.1:3001/sibs-mock-checkout
          SIBS_TERMINAL_ID: 1
          SIBS_CLIENT_ID: x
          SIBS_WEBHOOK_SECRET: O0Bur9uhZkS54NkwFhVyeutED6DhLbOQUBDt3i3W/C4=
          SIBS_MULTIBANCO_ENTITIY: 2400
          SIBS_MULTIBANCO_EXPIRATION_DAYS: 3
          SIBS_CHECK_STATUS_ENDPOINT: http://localhost:3001/sibs-status-mock/{{transactionID}}

          DEFAULT_COMMISSION: 25
          ORGANIZER_REVIEWERS_EMAILS: "admin@gmail.com, admin1@gmail.com"

          DOMAIN_URL: "http://localhost:3000"

          SCHEDULER_SECRET: "abc"

          SMS_ENDPOINT: "http://127.0.0.1:3001/bulkgate"
          SMS_APPLICATION_ID: 1111
          SMS_APPLICATION_TOKEN: token


      - uses: actions/upload-artifact@v2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - uses: actions/upload-artifact@v2
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
