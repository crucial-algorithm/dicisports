name: Build & Deploy to Scaleway

on:
  push:
    branches:
      - master
      - staging

jobs:
  build:
    name: 🐳 Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1

      - name: 🔑 Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}

      - name: 🐳 Build the Docker image
        run: docker build . -t dici-stg --no-cache

      - name: Tag the Docker image with version
        if: ${{ success() }}
        run: docker tag dici-stg ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/dici-stg:${{ github.sha }}

      - name: Push the Docker Image
        if: ${{ success() }}
        run: docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/dici-stg:${{ github.sha }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest

    needs: build
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Update tag of current image
        run: |
          curl -X PATCH \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"registry_image": "${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/dici-stg:${{ github.sha }}"}' \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${{ secrets.CONTAINER_ID }}"

      - name: Redeploy app
        run: |
          curl -X POST \
            -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${{ secrets.CONTAINER_ID }}/deploy"