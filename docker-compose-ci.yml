version: '3'
services:
  database:
    image: 'postgres:13'
    environment:
      - POSTGRES_USER=dici
      - POSTGRES_PASSWORD=sports
      - POSTGRES_DB=dicisports
    ports:
      - '6432:5432'

  catcher:
    image: filipeutter/http-catcher:2.2
    environment:
      - 'ENDPOINTS=[{"method": "post", "endpoint": "/sibs-mock-checkout", "response": {"formContext": "{\"transactionId\": \"{{merchant.merchantTransactionId}}\"}", "expiry": "2099-12-31", "transactionID": "{{merchant.merchantTransactionId}}"}}, {"method": "post", "endpoint": "/sibs-mock-form-submit", "response": {"type": "redirect", "url": "http://dicisports:3000/checkout/submitted/{{transactionId}}"}, "sideEffect": {"delay": 500, "url": "http://dicisports:3000/wh/sibs", "method": "post", "headers": [{"key": "X-Authentication-Tag", "value": "{{at}}"}, {"key": "X-Initialization-Vector", "value": "{{iv}}"}, {"key": "Content-Type", "value": "text/plain"}], "body": "{{message}}"}}, {"method": "get", "endpoint": "/sibs-status-mock/{{transactionID}}", "response": {"type": "case", "options": {"test": "transactionID", "defaultOption": "reference-paid", "responses": [{"value": "reference-pending", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-pending", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Pending", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "0.0", "currency": "EUR"}, "status": "UNPAID", "expireDate": "2070-01-01T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-19T10:44:19.578Z", "startTime": "2023-05-19T10:44:17.943Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-paid", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-paid", "amount": {"currency": "EUR", "value": "46.00"}, "paymentType": "PREF", "paymentStatus": "Success", "paymentReference": {"entity": "24000", "reference": "883960846", "paymentEntity": "24000", "amount": {"value": "46.0", "currency": "EUR"}, "status": "PARTPAIDCLS", "expireDate": "2070-01-01T00:00:00.000+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T15:30:42.504Z", "startTime": "2023-05-20T15:30:41.503Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}, {"value": "reference-expired", "response": {"merchant": {"terminalId": "57677", "merchantTransactionId": "9LL2vyChygdXKKcy9sKk"}, "transactionID": "reference-expired", "amount": {"currency": "EUR", "value": "40.00"}, "paymentType": "PREF", "paymentStatus": "Declined", "paymentReference": {"status": "UNKN", "expireDate": "2023-05-20T12:22:00.495+01:00"}, "paymentMethod": "REFERENCE", "execution": {"endTime": "2023-05-20T11:30:50.639Z", "startTime": "2023-05-20T11:30:49.461Z"}, "returnStatus": {"statusCode": "000", "statusMsg": "Success", "statusDescription": "Success"}}}]}}}]'
    ports:
      - '3001:3001'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dicisports:
    image: "dicisports:latest"
    depends_on:
      - database
      - catcher
    build:
      context: .
      dockerfile: Dockerfile-ci
    ports:
      - '3000:3000'
    environment:
      CY_REQUEST_TIMEOUT: 15000
      CY_RESPONSE_TIMEOUT: 90000
      CY_DEFAULT_COMMAND_TIMEOUT: 30000
      CY_BASE_URL: http://127.0.0.1:3000

      DATABASE_URL: postgresql://dici:sports@database:5432/dicisports?schema=public&charset=utf8

      MAPBOX_TOKEN: x

      CLOUDINARY_CLOUD_NAME: dicisports
      CLOUDINARY_API_KEY: z
      CLOUDINARY_API_SECRET: z
      CLOUDINARY_UPLOAD_PRESET: members-upload

      SESSION_SECRET: z
      MAGIC_LINK_SECRET: z

      EMAIL_VERIFIER_TOKEN: z
      MAILGUN_SENDING_KEY: z
      MAILGUN_ENDPOINT: http://127.0.0.1:3001

      CONVERT_KIT_FORM: 3280014
      CONVERT_KIT_API_KEY: 1

      AWS_S3_BUCKET: dicisports-dev
      AWS_REGION: eu-west-3
      AWS_ACCESS_KEY_ID: z
      AWS_SECRET_ACCESS_KEY: z

      RELEASE: y

      SIBS_CHECKOUT_FORM_SCRIPT: /sibs.mock.js
      SIBS_API_TOKEN: x
      SIBS_URL_ENDPOINT: http://catcher:3001/sibs-mock-checkout
      SIBS_TERMINAL_ID: 1
      SIBS_CLIENT_ID: x
      SIBS_WEBHOOK_SECRET: O0Bur9uhZkS54NkwFhVyeutED6DhLbOQUBDt3i3W/C4=
      SIBS_MULTIBANCO_ENTITIY: 2400
      SIBS_MULTIBANCO_EXPIRATION_DAYS: 3
      SIBS_CHECK_STATUS_ENDPOINT: http://catcher:3001/sibs-status-mock/{{transactionID}

